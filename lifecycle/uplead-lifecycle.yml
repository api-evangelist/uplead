plan_gating:
  note: >-
    Endpoint availability is tied to the account plan, and that is itself a
    lifecycle fact: Prospector Pro, Quick Search, Industries and Lists are
    Professional/Elite/Enterprise only, and prospector-preview is reseller-only.
    An operation can therefore disappear from an account's reachable surface on a
    downgrade without any API version changing.
  see_also: plans/uplead-plans-pricing.yml
