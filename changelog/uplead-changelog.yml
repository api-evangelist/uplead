  - date: '2026-08-10'
    url: https://support.uplead.com/en/articles/16298460-release-notes-08-10-2026
    api_change: false
    breaking: false
    additions:
      - >-
        "Includes vs. Exact match" control extended to more filters, including
        exclusion filters for Contact Name, Company Name, Title and City.
    fixes:
      - Company URL overlay no longer distorts other filters in the filter panel.
      - Exclusion panels scroll correctly.
      - '"Previous downloads" and "My lists" pickers enlarged to show about ten lists at once.'
  - date: '2026-07-30'
    url: https://support.uplead.com/en/articles/16162084-release-notes-07-30-2026
    api_change: false
    breaking: false
    additions:
      - Clicking a filter bubble opens the specific sub-filter it belongs to.
    fixes:
      - Clear-filter now reliably removes filters carried over from an earlier search.
      - Selecting previous download lists as exclusions no longer fails the search.
      - Zapier automations now trigger when contacts are unlocked.
      - Invalid contacts pushed to HubSpot are handled instead of failing silently.
      - Company download notification links point at the file rather than the verification page.
  - date: '2026-07-20'
    url: https://support.uplead.com/en/articles/16003199-release-notes-07-20-2026
    api_change: false
    breaking: false
    additions:
      - >-
        New Geotechnical (Geotechnical Engineering) industry classification,
        adding 1,069,624 contacts across 3,757 companies.
      - Invoices shown on the Billing page with status and amount, plus a "View invoice" action.
      - Credit balance updates in real time after any credit-using action.
      - Maximum upload file size displayed before an upload is attempted.
    fixes:
      - Filters persist when navigating between results and search.
      - Company exclusion preferences apply correctly after login.
      - Unlocked contacts are immediately available for download.
      - Download-list notifications, progress indicators and countdown timers fixed.
      - Payment card can be added in the Offline Payments workflow.
      - Invoice download links no longer expire.
