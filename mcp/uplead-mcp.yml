agent_notes:
  - >-
    Every search tool spends money. One credit is deducted per company record and
    per contact record whose email_status is "valid" or "accept_all". Call
    prospector_search or quick_search with count_only=true first to size a query
    for free, and read data.userInfo.availableCredits off every response.
  - >-
    There is no idempotency key. add_contacts_to_list and delete_contacts_from_list
    must not be blindly retried on an ambiguous failure.
  - >-
    403 does not mean a bad key. Several tools are plan-gated to
    Professional/Elite/Enterprise.

